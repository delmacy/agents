coding_task:
  description: >
    Analyze the requirements provided: {requirements} for the project: {topic}.
    Implement the full backend solution using Python, FastAPI, and Pydantic.
    Follow Clean Code principles.
    The code must be complete and executable.
    You must use the FileWriteTool to save the generated files to the 'output/' directory.
    Structure the application properly (e.g., main.py, schemas.py, etc., inside output/).
  expected_output: >
    A fully functional Python application saved as files in the output directory.
    Return a summary of the created files and their purpose.
  agent: backend_agent

validation_task:
  description: >
    Analyze the files generated in the 'output/' directory by the coding_task.
    Check if the following files exist and are valid: main.py, models.py, schemas.py, requirements.txt.
    Verify if the code structure seems complete based on the requirements: {requirements}.
    You must use the FileWriteTool to create a 'validation_report.json' file in 'output/' containing:
    {{
      "is_valid": boolean,
      "missing_features": [list of strings],
      "feedback": "detailed feedback string"
    }}
  expected_output: >
    A JSON file named 'validation_report.json' in the output directory with the validation results.
  agent: review_agent
  context: [coding_task]

infrastructure_task:
  description: >
    Start by reading the generated code in the 'output/' directory to identify ports and dependencies.
    Analyze the code generated by the Backend Agent.
    Create a Dockerfile and a docker-compose.yml file to containerize the application.
    Ensure all dependencies (from requirements.txt if generated, or inferred) are installed.
    Expose the correct ports (default FastAPI port is 8000).
    You must use the FileWriteTool to save 'Dockerfile' and 'docker-compose.yml' to the 'output/' directory.
  expected_output: >
    Dockerfile and docker-compose.yml files saved in the output directory.
    Return a confirmation that the infrastructure files have been created.
  agent: devops_agent
  context: [coding_task]

testing_task:
  description: >
    Review the final implementation in 'output/' to ensure all integration tests target existing endpoints correctly.
    Analyze the code generated by the Backend Agent.
    Create a 'test_main.py' file in the 'output/' directory.
    The tests should use 'pytest' and 'httpx' and target the API at http://127.0.0.1:8000.
    Cover the main CRUD operations defined in the requirements: {requirements}.
    You must use the FileWriteTool to save 'test_main.py' to the 'output/' directory.
  expected_output: >
    A 'test_main.py' file saved in the output directory.
  agent: qa_agent
  context: [coding_task]
