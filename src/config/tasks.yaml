discovery_task:
  description: >
    Conversation with user.
    CONTEXT: "{conversation_history}"
    LATEST: "{current_message}"
    Goal: Define 'final_plan.json'.
  expected_output: >
    Response string or 'final_plan.json'.
  agent: product_manager_agent

architecture_task:
  description: >
    Analyze 'final_plan.json'.
    Define Directory Structure and Database Schema.
    Create 'system_architecture.json' in 'output/'.
  expected_output: >
    A JSON file defining the high-level architecture.
  agent: architect_agent

logic_specification_task:
  description: >
    Analyze 'system_architecture.json'.
    Write Detailed Algorithmic Logic for every method in 'technical_spec.md'.
    Use the strict Markdown format defined in your role.
  expected_output: >
    A comprehensive Markdown file 'technical_spec.md'.
  agent: technical_designer_agent
  context: [architecture_task]

sprint_planning_task:
  description: >
    ANALYZE 'system_architecture.json' and 'technical_spec.md'.
    Create a detailed execution plan JSON file named 'work_orders.json'.
    List files to be created in order of dependency.
  expected_output: >
    A JSON file 'work_orders.json'.
  agent: scrum_master_agent
  context: [logic_specification_task, architecture_task]

coding_task:
  description: >
    EXECUTE the 'work_orders.json'.
    Translate logic from 'technical_spec.md' into Python code.
    
    ### CRITICAL - FIX MODE ###
    Check if there is feedback from QA:
    FEEDBACK: "{feedback}"
    
    IF feedback exists (it means previous code FAILED):
    1. Read the error message.
    2. REWRITE the code to fix the error while maintaining the logic.
    
    IF no feedback:
    Generate code strictly according to specs.
  expected_output: >
    Corrected Python source code files.
  agent: backend_agent
  context: [sprint_planning_task, logic_specification_task]

environment_setup_task:
  description: >
    1. Check if 'requirements.txt' exists.
    2. Run `pip install -r requirements.txt` using venv tool.
    3. Verify installation.
  expected_output: >
    Installation logs.
  agent: devops_agent
  context: [coding_task]

test_planning_task:
  description: >
    READ 'technical_spec.md'.
    Create 'test_plan.md' with Happy Paths, Edge Cases, and Error States for all methods.
  expected_output: >
    A Markdown file 'test_plan.md'.
  agent: qa_strategist_agent
  context: [logic_specification_task]

test_implementation_task:
  description: >
    READ 'test_plan.md'.
    1. Create 'tests/' directory.
    2. Write pytest functions for every scenario.
    3. EXECUTE `pytest` using venv tool.
    4. Return the FULL OUTPUT of the test execution.
  expected_output: >
    Pytest execution logs and pass/fail status.
  agent: qa_automation_agent
  context: [test_planning_task, coding_task]