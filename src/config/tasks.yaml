discovery_task:
  description: >
    Engage in a conversation with the user (if needed) or analyze the initial input to refine requirements.
    Produce a comprehensive 'final_plan.json' in the 'output/' directory.
    The plan should include: project_name, detailed_requirements, feature_list, and user_stories.
  expected_output: >
    A JSON file 'final_plan.json' containing the finalized project plan.
  agent: product_manager_agent

blueprint_task:
  description: >
    Analyze the 'final_plan.json'.
    Design the software architecture, folder structure, and database schema.
    Define the stack (FastAPI, SQLite, Pydantic) and libraries.
    Create a 'blueprint.json' file in 'output/' that strictly defines:
    - File structure (paths and descriptions)
    - Data models (tables/fields)
    - API Endpoints (methods, paths, inputs, outputs)
    The Backend Agent will use this EXACT blueprint to write code.
  expected_output: >
    A JSON file 'blueprint.json' containing the technical architecture.
  agent: architect_agent

coding_task:
  description: >
    Read and analyze the 'blueprint.json' file in 'output/'.
    Implement the full backend solution strictly following the blueprint.
    Use Python, FastAPI, and Pydantic.
    Follow Clean Code principles.
    The code must be complete and executable.
    You must use the FileWriteTool to save the generated files to the 'output/' directory.

    IMPORTANT: If there is feedback from a previous failed run, address it: {feedback}
  expected_output: >
    A fully functional Python application saved as files in the output directory.
  agent: backend_agent
  context: [blueprint_task]

validation_task:
  description: >
    Analyze the files generated in the 'output/' directory.
    Check if the files match the structure defined in 'blueprint.json'.
    Verify if main.py, models.py, schemas.py, requirements.txt exist and are valid.
    Create a 'validation_report.json' file in 'output/' containing:
    {{
      "is_valid": boolean,
      "missing_features": [list of strings],
      "feedback": "detailed feedback string"
    }}
  expected_output: >
    A JSON file named 'validation_report.json' in the output directory.
  agent: review_agent
  context: [coding_task]

infrastructure_task:
  description: >
    1. Create a Python virtual environment (venv) in 'output/<job_id>/venv' using the VenvExecutionTool (this tool handles the creation internally).
    2. Install the dependencies from 'requirements.txt' into this venv using 'pip install -r requirements.txt'.
    3. Also create a Dockerfile and docker-compose.yml for production deployment context (standard DevOps work).
  expected_output: >
    A set up virtual environment, plus Dockerfile and docker-compose.yml.
  agent: devops_agent
  context: [coding_task]

testing_task:
  description: >
    1. Analyze the code and requirements to write a 'test_main.py' file in 'output/'.
    2. Execute the tests using the VenvExecutionTool with the command 'python -m pytest test_main.py'.
    3. Report the test results.
  expected_output: >
    Test file created and executed. A summary of test results.
  agent: qa_agent
  context: [coding_task]

audit_task:
  description: >
    Perform a final Technical Audit of the generated project in 'output/'.
    Verify strict compliance with the Acceptance Criteria Checklist defined in your backstory.
    - Check Architecture vs Blueprint.
    - Check Venv Health (dependencies installed?).
    - Check Test Results (100% pass?).
    - Check Security (no hardcoded keys).
    - Check Documentation (README venv instructions).

    You must generate a 'audit_report.json' file in 'output/' with the status (APPROVED/REJECTED), blockers, and recommendations.
  expected_output: >
    A JSON file 'audit_report.json' in the output directory.
  agent: tech_lead_agent
  context: [blueprint_task, coding_task, infrastructure_task, testing_task]
